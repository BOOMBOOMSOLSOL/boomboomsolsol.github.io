---
layout: default
title: Apps
description: 붐붐솔솔이 만드는 앱들
---

<!-- Header -->
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4 pb-8 text-center">
  <div>
    <p class="reveal inline-block rounded-full px-3 py-1 text-[11px] uppercase tracking-[0.15em] font-medium bg-sage/10 text-sage-dark mb-4">
      Apps
    </p>
    <h1 class="reveal text-4xl md:text-5xl lg:text-6xl font-extrabold tracking-tight leading-tight text-ink mb-4">
      우리가 만드는 앱
    </h1>
    <p class="reveal text-lg md:text-xl text-sub leading-relaxed max-w-[50ch] mx-auto">
      매일 쓰고 싶은 앱을 만듭니다.
      작은 습관이 큰 변화가 되도록.
    </p>
  </div>
</section>

<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-12 md:pb-16"><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 stagger">
{% for app in site.data.apps %}<a href="{{ app.url }}" class="reveal group"><div class="bg-black/[0.02] ring-1 ring-black/5 p-1.5 rounded-[2rem] premium-hover h-full"><div class="bg-surface rounded-[calc(2rem-0.375rem)] overflow-hidden h-full"><div class="aspect-[4/3] overflow-hidden"><img src="{{ app.icon }}" alt="{{ app.name }}" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-700" loading="lazy" decoding="async"></div><div class="p-6"><h2 class="text-lg font-bold text-ink group-hover:text-sage-dark">{{ app.name }}</h2><p class="text-xs text-sage-dark mt-2">{{ app.platforms }} · {{ app.status }}</p><p class="text-sm text-sub leading-relaxed mt-2">{{ app.description }}</p></div></div></div></a>{% endfor %}
</div></section>
